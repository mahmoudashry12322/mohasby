name: Accounting validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mohasby_test
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: mohasby_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mohasby_test -d mohasby_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mohasby_test:ephemeral_ci_password@localhost:5432/mohasby_test?connection_limit=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://mohasby_test:ephemeral_ci_password@localhost:5432/mohasby_test?connection_limit=10
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results/
