<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>غير متصل بالإنترنت — مُحاسبي</title>
  <link rel="icon" href="/icons/icon-192x192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Noto Kufi Arabic", sans-serif;
      background: #F7F5F3;
      color: #1C2321;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4E0DC;
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(7, 28, 24, 0.05);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #1F4E42;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(31, 78, 66, 0.25);
    }
    .icon-wrap img {
      width: 44px;
      height: 44px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #071C18;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #58605D;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1F4E42;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      width: 100%;
    }
    .retry-btn:hover {
      background: #071C18;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/icons/icon-192x192.png" alt="مُحاسبي" />
    </div>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>يبدو أن الاتصال بالشبكة قد انقطع. يتم حفظ بياناتك بأمان على السحابة، ويمكنك إعادة المحاولة بمجرد عودة الاتصال.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      إعادة المحاولة الآن ↻
    </button>
  </div>
</body>
</html>
